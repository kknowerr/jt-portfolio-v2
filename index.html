    <meta name="theme-color" content="#100e0b" />
    <script>
      // Apply theme before first paint to avoid a flash.
      // Saved choice wins; otherwise follow the OS (prefers-color-scheme).
      try {
        var t = localStorage.getItem('theme');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
